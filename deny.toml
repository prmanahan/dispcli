# cargo-deny configuration — license, advisory, and ban checks.
# Mirrors the license tiers from skills/rust.md <dependencies>.
# Schema version 2 — denies unknown/copyleft licenses implicitly.
# Run: `cargo deny check`

[graph]
targets = []

[licenses]
version = 2
# Don't warn when a license in `allow` isn't used by any dep — the list declares
# policy, not present-day usage.
unused-allowed-license = "allow"

# Green tier — auto-proceed.
# SPDX dual expressions ("MIT OR Apache-2.0") resolve automatically when at
# least one of the listed licenses is in `allow`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    # Unicode-3.0 — permissive; required by `unicode-ident` (transitive dep of clap).
    # Hit by any project using clap; tightening means removing clap.
    "Unicode-3.0",
]

# Yellow tier (LGPL, MPL-2.0) — add per-crate exceptions below after approval.
# [[licenses.exceptions]]
# name = "some-lgpl-crate"
# version = "*"
# allow = ["LGPL-2.1"]

# Red tier (GPL, AGPL, SSPL) — denied implicitly (not in `allow`).

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards         = "allow"
